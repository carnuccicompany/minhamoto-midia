<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1640px;height:624px;overflow:hidden;font-family:Inter,sans-serif;background:#040914}
.bg{position:absolute;inset:0;background:radial-gradient(900px 520px at 78% 55%,rgba(37,110,255,.55),transparent 65%),radial-gradient(700px 400px at 20% 110%,rgba(20,70,200,.35),transparent 70%),linear-gradient(120deg,#030712 0%,#071433 55%,#0a2260 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(120,160,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,160,255,.06) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(800px 500px at 70% 50%,#000 30%,transparent 80%)}
.copy{position:absolute;left:330px;top:118px;width:620px;color:#fff}
.brand{display:flex;align-items:center;gap:16px;margin-bottom:26px}
.brand img{width:58px;height:58px;border-radius:14px}
.word{font-weight:900;font-size:34px;letter-spacing:.06em}
.word b{color:#3d86ff;font-weight:900}
h1{font-size:60px;line-height:1.04;font-weight:800;letter-spacing:-.02em}
h1 span{color:#4b8fff}
p{margin-top:20px;font-size:23px;line-height:1.35;color:#b9c8e8;font-weight:500;width:560px}
.cta{margin-top:28px;display:inline-flex;align-items:center;gap:12px;padding:14px 24px;border-radius:999px;background:#2f6fff;font-weight:700;font-size:20px;box-shadow:0 10px 30px rgba(47,111,255,.45)}
.cta small{font-weight:500;opacity:.85}
.phone{position:absolute;width:236px;height:512px;border-radius:40px;background:#0b0d12;padding:9px;box-shadow:0 30px 60px rgba(0,0,0,.55),0 0 0 2px #2a3550 inset,0 0 60px rgba(60,130,255,.25)}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:32px;display:block}
.p1{left:990px;top:118px;transform:rotate(-8deg)}
.p2{left:1160px;top:64px;z-index:2;width:250px;height:542px}
.p3{left:1340px;top:126px;transform:rotate(8deg)}
</style></head><body><div class="bg"></div><div class="grid"></div>
<div class="copy">
<div class="brand"><img src="icon.png"><div class="word">MINHA<b>MOTO</b></div></div>
<h1>O jeito de cuidar<br>da sua moto <span>mudou.</span></h1>
<p>Revisões, histórico e documentos da sua moto num só lugar.</p>
<div class="cta">Baixe agora <small>App Store · Google Play</small></div>
</div>
<div class="phone p1"><img src="historico-completo.png"></div>
<div class="phone p2"><img src="plano-atual.png"></div>
<div class="phone p3"><img src="combustivel-media.png"></div>
</body></html>
