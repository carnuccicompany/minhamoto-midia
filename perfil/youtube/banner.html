<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url('../../agencia/designer/assets/fontes/inter-latin-400-normal.woff2') format('woff2');font-weight:500}
@font-face{font-family:Inter;src:url('../../agencia/designer/assets/fontes/inter-latin-600-normal.woff2');font-weight:600}
@font-face{font-family:Inter;src:url('../../agencia/designer/assets/fontes/inter-latin-700-normal.woff2');font-weight:700}

*{margin:0;padding:0;box-sizing:border-box}
body{width:2560px;height:1440px;overflow:hidden;font-family:Inter,sans-serif;background:#040914;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(1300px 700px at 72% 52%,rgba(37,110,255,.55),transparent 65%),radial-gradient(1000px 600px at 15% 100%,rgba(20,70,200,.35),transparent 70%),linear-gradient(120deg,#030712 0%,#071433 55%,#0a2260 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(120,160,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,160,255,.06) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(1200px 700px at 65% 50%,#000 30%,transparent 80%)}
/* área segura: x 507–2053, y 508–931 */
.copy{position:absolute;left:560px;top:540px;width:820px;color:#fff}
.brand{display:flex;align-items:center;gap:18px;margin-bottom:22px}
.brand img{width:64px;height:64px;border-radius:15px}
.word{font-weight:900;font-size:36px;letter-spacing:.06em}
.word b{color:#3d86ff;font-weight:900}
h1{font-size:72px;line-height:1.02;font-weight:800;letter-spacing:-.02em}
h1 span{color:#4b8fff}
.cta{margin-top:26px;display:inline-flex;align-items:center;gap:14px;padding:16px 28px;border-radius:999px;background:#2f6fff;font-weight:700;font-size:24px;box-shadow:0 12px 34px rgba(47,111,255,.45)}
.cta small{font-weight:500;opacity:.9}
.phone{position:absolute;width:300px;height:650px;border-radius:50px;background:#0b0d12;padding:11px;box-shadow:0 40px 80px rgba(0,0,0,.6),0 0 0 2px #2a3550 inset,0 0 80px rgba(60,130,255,.28)}
.scr{position:relative;width:100%;height:100%;border-radius:40px;overflow:hidden;background:#000}
.scr img{width:100%;display:block;margin-top:-18px}
.sb{position:absolute;left:0;right:0;top:0;height:34px;background:#05070b;display:flex;align-items:center;justify-content:space-between;padding:0 26px;color:#fff;font-weight:600;font-size:14px}
.isl{position:absolute;left:50%;top:9px;width:86px;height:24px;margin-left:-43px;border-radius:14px;background:#000}
.p1{left:1450px;top:600px;transform:rotate(-8deg)}
.p2{left:1640px;top:520px;z-index:2;width:316px;height:684px}
.p3{left:1830px;top:610px;transform:rotate(8deg)}
.guide{display:none;position:absolute;left:507px;top:508px;width:1546px;height:423px;outline:4px dashed #ff3b3b}
body.g .guide{display:block}
</style></head><body><div class="bg"></div><div class="grid"></div>
<div class="copy">

<div class="cta">Baixe agora <small>App Store · Google Play</small></div>
</div>

<div class="phone p2"><div class="scr"><img src="tela-manutencao.png"><div class="sb"><span>9:41</span><span>●●● ▮</span></div><div class="isl"></div></div></div>
