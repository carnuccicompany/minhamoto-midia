<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url('file://%%ASSETS%%/fontes/inter-latin-600-normal.woff2');font-weight:600}
@font-face{font-family:Inter;src:url('file://%%ASSETS%%/fontes/inter-latin-700-normal.woff2');font-weight:700}
@font-face{font-family:Inter;src:url('file://%%ASSETS%%/fontes/inter-latin-800-normal.woff2');font-weight:800}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;font-family:Inter,sans-serif;
  background:
    radial-gradient(95% 55% at 50% 118%, rgba(59,130,246,.30), rgba(59,130,246,0) 62%),
    linear-gradient(170deg,#05080e 0%,#0a1424 55%,#0d1b31 100%)}
.wrap{position:absolute;inset:0;text-align:center;padding:96px 84px 0}
h1{font-weight:800;font-size:%%TSIZE%%px;line-height:1.14;letter-spacing:-1.5px;color:#f3f7fc}

.apoio b{font-weight:800;color:#4b8dff}
.phone{width:%%PW%%px;margin:%%PM%%px auto 0;background:#0b0b0e;border-radius:58px;padding:11px;
  border:1px solid rgba(255,255,255,.07);
  box-shadow:0 42px 90px rgba(0,0,0,.65),0 0 90px rgba(59,130,246,.22)}
.phone img{display:block;width:100%;border-radius:47px}
.rodape{position:absolute;left:0;right:0;bottom:50px;text-align:center;
  font-weight:700;font-size:34px;color:#4b8dff}
.selos{position:absolute;left:0;right:0;bottom:56px;text-align:center}
.selos img{width:520px;filter:drop-shadow(0 0 1px rgba(255,255,255,.55)) drop-shadow(0 8px 24px rgba(0,0,0,.5))}
.fade{position:absolute;left:0;right:0;bottom:0;height:160px;
  background:linear-gradient(rgba(13,27,49,0),#0d1b31 88%)}
</style></head><body>
<div class="wrap">
  <h1>%%TITULO%%</h1>
  %%APOIO%%
  %%PHONE%%
</div>
%%FADE%%

</body></html>
