name: insights
on:
  schedule:
    - cron: "41 2 * * *"   # todo dia 02:41 UTC = 23:41 BRT do dia anterior (depois do slot das 21h); aprovado pelo Shelby em 23/11 (D-20261123-dados-5)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: insights
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Coletar métricas
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python3 scripts/insights.py
      - name: Commit
        run: |
          git config user.name "minhamoto-bot"
          git config user.email "bot@minhamoto.app"
          git add dados/
          git diff --cached --quiet || git commit -m "Insights da semana"
          git push
