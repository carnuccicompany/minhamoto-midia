name: Publicar carrossel

on:
  schedule:
    # Confere a cada 15 min; o script só publica nos horários 12h, 15h, 18h e 21h
    # de Brasília (até 2h de atraso), uma vez por horário.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      simular:
        description: "Só mostrar o próximo, sem publicar"
        type: boolean
        default: false
      forcar:
        description: "Publicar o próximo agora, fora do horário"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar próximo da fila
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          SIMULAR: ${{ inputs.simular && '1' || '0' }}
          FORCAR: ${{ inputs.forcar && '1' || '0' }}
        run: python scripts/publicar.py
      - name: Salvar estado da fila
        if: always()
        run: |
          git config user.name "minhamoto-bot"
          git config user.email "minhamoto-bot@users.noreply.github.com"
          git add fila/estado.json
          git diff --cached --quiet || (git commit -m "Publicado: atualiza fila" && git push)
